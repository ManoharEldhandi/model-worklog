<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Model Worklog Web Demo</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<main class="shell">
		<header class="topbar">
			<div class="brand">
				<img src="/logo.png" width="32" height="32" alt="">
				<div>
				<h1>Model Worklog</h1>
				<p class="eyebrow">Local activity</p>
				</div>
			</div>
			<div class="connection" id="connection-status" aria-live="polite">Starting local collector</div>
		</header>

		<section class="workspace" aria-label="Chat and trace dashboard">
			<section class="conversation" aria-labelledby="chat-title">
				<div class="section-heading">
					<div>
						<p class="eyebrow">Workspace</p>
						<h2 id="chat-title">Workspace review</h2>
					</div>
					<span class="mode" id="provider-mode">Checking provider</span>
				</div>
				<p class="workspace-context" id="workspace-context">Preparing the isolated sample workspace</p>
				<div class="messages" id="messages" aria-live="polite">
					<p class="empty-state">No messages yet.</p>
				</div>
				<form class="composer" id="chat-form">
					<label class="sr-only" for="message">Message</label>
					<textarea id="message" name="message" maxlength="2000" placeholder="Review the inventory and pricing logic..." required></textarea>
					<button id="send-button" type="submit" title="Send request" aria-label="Send request">&#8593;</button>
				</form>
			</section>

			<aside class="observability" aria-label="Execution trace">
				<section class="log-panel" aria-labelledby="log-title">
					<div class="section-heading compact">
						<div>
							<p class="eyebrow" id="run-date">Execution</p>
							<h2 id="log-title">Activity log</h2>
						</div>
						<div class="trace-actions">
							<span class="run-state" id="run-state" role="status">Idle</span>
							<a class="download-button" id="download-link" aria-disabled="true" tabindex="-1" title="Download captured JSON"><span aria-hidden="true">&#8595;</span> JSON</a>
						</div>
					</div>
					<div class="log-toolbar">
						<fieldset class="view-switch" aria-label="Log view">
							<label><input type="radio" name="log-view" value="activity" checked><span>Activity</span></label>
							<label><input type="radio" name="log-view" value="spans"><span>SDK spans</span></label>
						</fieldset>
						<label class="follow-control"><input id="follow-log" type="checkbox" checked>Follow</label>
					</div>
					<div class="log-filters">
						<label class="sr-only" for="activity-search">Search captured activity</label>
						<input id="activity-search" type="search" placeholder="Search files, tools, output..." autocomplete="off">
						<label class="sr-only" for="activity-filter">Activity type</label>
						<select id="activity-filter">
							<option value="all">All activity</option>
							<option value="files">Files</option>
							<option value="tool">Tools &amp; MCP</option>
							<option value="command">Commands &amp; tests</option>
							<option value="messages">Messages &amp; plans</option>
							<option value="output">Output</option>
							<option value="issues">Failures &amp; capture gaps</option>
						</select>
					</div>
					<div class="log-caption"><span id="activity-count">0 activities</span><span>UTC</span></div>
					<ol class="timeline" id="timeline" aria-label="Captured activity" tabindex="0">
						<li class="empty-state">No captured activity.</li>
					</ol>
					<footer class="log-footer"><span id="capture-summary">No run selected</span><span class="trace-count" id="trace-count">0 spans stored</span></footer>
				</section>
			</aside>
		</section>
	</main>
	<script src="/app.js"></script>
</body>
</html>
